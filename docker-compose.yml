services:
  opds:
    image: ghcr.io/hkrlogic/simpleopds:latest
    # To build locally instead, comment out `image` and use:
    # build: .
    container_name: opds
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - opds-books:/books
    # Hardening: the app needs none of these privileges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Strongly recommended if the port is reachable by anyone but you:
    # environment:
    #   OPDS_USER: reader
    #   OPDS_PASS: change-me
    #   MAX_UPLOAD_MB: 500

volumes:
  opds-books:
