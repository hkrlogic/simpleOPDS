# To turn on a password, delete just the # character at the start of the four
# "environment" lines below (leave the spaces alone), then change the password.
services:
  opds:
    image: ghcr.io/hkrlogic/simpleopds:latest
    container_name: opds
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - opds-books:/books
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    #environment:
    #  OPDS_USER: reader
    #  OPDS_PASS: change-me
    #  MAX_UPLOAD_MB: 500

volumes:
  opds-books:
